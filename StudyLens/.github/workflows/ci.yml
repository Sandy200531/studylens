name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install deps
        working-directory: backend
        run: pip install -r requirements.txt ruff
      - name: Lint
        working-directory: backend
        run: ruff check app
      - name: Import check
        working-directory: backend
        run: python -c "from app.main import app"

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install deps
        working-directory: extension
        run: npm ci
      - name: Typecheck + build
        working-directory: extension
        run: npm run build
