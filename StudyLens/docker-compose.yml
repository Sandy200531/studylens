services:
  postgres:
    image: postgres:16
    container_name: studylens-postgres
    environment:
      POSTGRES_USER: studylens
      POSTGRES_PASSWORD: studylens
      POSTGRES_DB: studylens
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studylens"]
      interval: 5s
      timeout: 3s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: studylens-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@studylens.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  ollama:
    image: ollama/ollama:latest
    container_name: studylens-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    profiles:
      - ai
    # Model lives in the `ollama` volume — pull once:
    #   docker compose --profile ai up -d ollama
    #   docker compose --profile ai exec ollama ollama pull qwen2.5:3b

  backend:
    build: ./backend
    container_name: studylens-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://studylens:studylens@postgres:5432/studylens
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      SECRET_KEY: dev-only-insecure-key-please-override-0123456789abcdef
      CORS_ORIGINS: '["chrome-extension://cndlmnklkickkegohhimjbmjmhanolhp","http://localhost:5173"]'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  ollama:
